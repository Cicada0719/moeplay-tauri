name: Verify published release
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to verify
        required: true
        type: string
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download the locally tested release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: gh release download "$RELEASE_TAG" --dir artifacts/verify
      - name: Verify same-batch hashes and required platforms
        run: node scripts/release-manifest.mjs artifacts/verify --verify
      - name: Verify signed updater metadata
        run: node scripts/verify-updater-artifacts.mjs --require --artifacts-dir artifacts/verify artifacts/verify/latest.json
