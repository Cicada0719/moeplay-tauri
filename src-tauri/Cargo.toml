[package]
name = "moeplay"
version = "0.20.16"
description = "萌游 MoeGame — 游戏与番剧管理器"
authors = ["MoeGame Dev"]
edition = "2021"
autobins = false
default-run = "moeplay"

[lib]
name = "moeplay_lib"
crate-type = ["rlib", "cdylib", "staticlib"]

[[bin]]
name = "moeplay"
path = "src/main.rs"

# 源健康检查 CLI（spec task-02 Step 5，供 CI 每日探测）：无 GUI 依赖，
# 仅复用 rules 模块中不依赖 AppHandle 的纯逻辑（health.rs::probe_one）。
[[bin]]
name = "rules-health"
path = "src/bin/rules_health.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }
# 构建期规则清单生成（spec task-02 Step 2）：计算每条内置规则的 SHA-256 并
# 做 schema 静态校验，输出 resources/rules/manifest.json。
serde_json = "1"
sha2 = "0.10"
hex = "0.4"

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-orientation = { path = "../plugins/tauri-plugin-orientation" }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.11", default-features = false, features = ["json", "stream", "rustls-tls"] }
ureq = "2"
futures-util = "0.3"
log = "0.4"
zip = "2"
# 只保留实际使用的特性（rt-multi-thread/macros/sync/time/net/fs/io-util），
# 替代 full：缩短编译时间、减小最终二进制。
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "fs", "io-util"] }
tokio-util = { version = "0.7", features = ["rt"] }
# `parallel`：让 rquickjs 的 Runtime 成为 Send+Sync，从而引擎可持有 worker 的
# Runtime 句柄并在取消/超时时直接调用 `runtime.set_interrupt_handler` 触发 JS 中断
# （spec §3.3 / DeepSeek 复审第 7 项）。
rquickjs = { version = "0.8", features = ["loader", "macro", "array-buffer", "futures", "parallel"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
open = "5"
urlencoding = "2"
regex = "1"
encoding_rs = "0.8"
notify = "6"
thiserror = "2.0.18"
rusqlite = { version = "0.32", features = ["bundled"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
sysinfo = "0.33"
url = "2"
serde_yaml = "0.9"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
keyring = { version = "=4.1.4", default-features = false, features = ["v1"] }
# WebDAV Basic 认证头手动拼 base64（spec §3.4 / task-05）
base64 = "0.22"
scraper = "0.22"
ego-tree = "0.10"
# 规则包热更新（spec task-02 §2.2）：ed25519 签名校验 / 版本比较 / 签名 base64 编码。
ed25519-dalek = "2"
semver = "1"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
rfd = "0.15"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"

[target.'cfg(target_os = "android")'.dependencies]
android-native-keyring-store = "1.0.0"
keyring-core = "1.0.0"
# Must stay on the same release as the copy pulled in by
# android-native-keyring-store so both crates share one global context slot.
ndk-context = "0.1.1"

# 发布优化：thin LTO + 单 codegen 单元减小二进制并改善启动；strip 去掉符号表。
# 收益可用 scripts/measure-tauri-startup.ps1 量化对比。
[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
opt-level = 3
