services:
  downloads:
    image: nginx:1.28-alpine
    container_name: moeplay-downloads
    restart: unless-stopped
    ports:
      - "8788:80"
    volumes:
      - ${MOEPLAY_RELEASE_ROOT:?Set MOEPLAY_RELEASE_ROOT}:/srv:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - tunnel
networks:
  tunnel:
    external: true
    name: ${MOEPLAY_TUNNEL_NETWORK:?Set MOEPLAY_TUNNEL_NETWORK}
