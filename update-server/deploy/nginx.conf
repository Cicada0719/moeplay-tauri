server {
  listen 80;
  server_name _;
  root /srv/current;
  index index.html;
  server_tokens off;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
  location / {
    limit_except GET HEAD { deny all; }
    try_files $uri $uri/ =404;
  }
  location ~ ^/(latest|release-manifest|versions)\.json$ {
    limit_except GET HEAD { deny all; }
    add_header Cache-Control "no-store, max-age=0" always;
    try_files $uri =404;
  }
  location /downloads/ {
    limit_except GET HEAD { deny all; }
    alias /srv/downloads/;
    autoindex off;
    add_header Content-Disposition attachment;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
  location /versions/ {
    limit_except GET HEAD { deny all; }
    alias /srv/sites/;
    autoindex off;
    add_header Cache-Control "no-cache";
  }
  location ~ /\. { deny all; }
}
